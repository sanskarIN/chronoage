name: Bug report
description: Report a reproducible ChronoAge defect
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ChronoAge. Please use fictional dates if your real dates are private.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Enter ...
        3. Select ...
        4. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ChronoAge version or commit
      placeholder: v1.0.0
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome on Windows 11
    validations:
      required: true
  - type: dropdown
    id: timezone
    attributes:
      label: Is time-of-day/timezone mode involved?
      options:
        - "No"
        - "Yes"
        - "Unsure"
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots are welcome if they do not expose private information.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed or replaced private personal data where possible.
          required: true
