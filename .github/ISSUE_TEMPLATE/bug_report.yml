name: Bug report
description: Report a reproducible ChronoAge defect
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ChronoAge. Use fictional dates/names and never attach a real profile backup or browser-storage dump to a public issue.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use the smallest fictional reproduction that still demonstrates the problem.
      placeholder: |
        1. Open #/difference
        2. Enter fictional dates ...
        3. Select ...
        4. Observe ...
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Public page route
      description: Include only the ChronoAge page route when useful; do not add personal values to the URL.
      placeholder: "#/profiles"
  - type: input
    id: version
    attributes:
      label: ChronoAge version or commit
      placeholder: v1.0.0
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome on Windows 11
    validations:
      required: true
  - type: dropdown
    id: display-mode
    attributes:
      label: How are you running ChronoAge?
      options:
        - Browser tab
        - Installed PWA
        - Unsure
    validations:
      required: true
  - type: dropdown
    id: connectivity
    attributes:
      label: Connectivity when the problem occurs
      options:
        - Online
        - Offline
        - Both
        - Unsure
    validations:
      required: true
  - type: dropdown
    id: timezone
    attributes:
      label: Is time-of-day/timezone mode involved?
      options:
        - "No"
        - "Yes"
        - "Unsure"
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots are welcome only after private names, dates, backups, tokens, and unrelated personal information are removed.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I replaced private personal data with fictional/minimal values where possible.
          required: true
        - label: I did not attach a real ChronoAge profile backup, localStorage dump, credential, or other private data.
          required: true
