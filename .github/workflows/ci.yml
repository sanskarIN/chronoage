name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Check formatting
        run: npm run format:check
      - name: Verify project metadata
        run: npm run metadata:check
      - name: Verify static security invariants
        run: npm run security:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Check documentation links
        run: npm run docs:links
      - name: Production build
        run: npm run build
      - name: Enforce production bundle budgets
        run: npm run performance:check
      - name: Audit high-severity runtime vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: chronoage-web
          path: dist
          if-no-files-found: error

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run E2E tests and capture release candidate screenshots
        run: npm run test:e2e
      - name: Upload release candidate screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronoage-release-candidate-screenshots
          path: test-results/**/chronoage-*.png
          if-no-files-found: ignore
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
