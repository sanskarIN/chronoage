name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Verify project
        run: npm run check
      - name: Archive production build
        run: tar -czf chronoage-web-${GITHUB_REF_NAME}.tar.gz dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "chronoage-web-${GITHUB_REF_NAME}.tar.gz" --generate-notes --verify-tag
